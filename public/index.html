<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUX TELAGEM</title>
<style>*{box-sizing:border-box}body{margin:0;background:#080d19;color:#f4f7ff;font:16px Arial;min-height:100vh;display:grid;place-items:center;padding:20px}.wrap{width:min(900px,100%)}header{text-align:center;margin-bottom:24px}h1{font-size:clamp(30px,6vw,52px);letter-spacing:3px;color:#68a5ff;margin:0}p{color:#9eacc7}.panel{background:#111a2d;border:1px solid #263653;border-radius:18px;padding:24px;display:grid;gap:14px;max-width:560px;margin:auto}label{font-size:14px;color:#bdc9df}input{width:100%;padding:14px;border-radius:10px;border:1px solid #354665;background:#0a1222;color:white;font-size:16px;margin-top:7px}button{border:0;border-radius:10px;padding:14px 18px;font-weight:bold;cursor:pointer;background:#397ff0;color:white}button.alt{background:#243653}button:disabled{opacity:.5}.actions{display:flex;gap:10px;flex-wrap:wrap}.status{color:#aebbd2;font-size:14px;min-height:20px}.video{margin-top:20px;background:#03060d;border:1px solid #263653;border-radius:14px;min-height:200px;display:grid;place-items:center;color:#7788a7;overflow:hidden;position:relative;transition:height .2s ease,max-width .2s ease}.video video{width:100%;height:auto;max-height:65vh;display:block;object-fit:contain}.video-controls{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:5}.video-controls button{width:42px;height:42px;padding:0;border-radius:10px;background:rgba(17,26,45,.92);border:1px solid #3a4d70;font-size:19px;display:grid;place-items:center;box-shadow:0 5px 18px rgba(0,0,0,.35)}.video-controls button:hover{background:#397ff0}.volume-box{display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:10px;background:rgba(17,26,45,.92);border:1px solid #3a4d70}.volume-box input{width:70px;margin:0;transform:rotate(-90deg);accent-color:#397ff0;padding:0;border:0;background:transparent}.video.small{max-width:620px;margin-left:auto;margin-right:auto}.video.large{min-height:360px}.hint{text-align:center;font-size:12px;color:#8290aa}</style></head>
<body><main class="wrap"><header><h1>NEXUX TELAGEM</h1><p>Compartilhe sua tela por uma sala</p></header><section class="panel"><label>Código da sala<input id="room" placeholder="Ex.: NEXUX123" maxlength="20"></label><div class="actions"><button id="create">Criar sala e compartilhar</button><button class="alt" id="join">Entrar na sala</button></div><div class="actions"><button class="alt" id="stop" disabled>Parar compartilhamento</button><button class="alt" id="copy">Copiar código</button></div><div id="status" class="status">Escolha uma opção.</div></section><div class="video" id="videoBox"><span id="placeholder">A transmissão aparecerá aqui</span><video id="video" autoplay playsinline></video><div class="video-controls" aria-label="Controles do vídeo"><div class="volume-box" title="Volume"><input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume"></div><button id="mute" title="Ativar/desativar som">🔊</button><button id="zoomOut" title="Diminuir tela">−</button><button id="zoomIn" title="Aumentar tela">+</button><button id="fullscreen" title="Tela cheia">⛶</button></div></div><p class="hint">O navegador pedirá permissão para compartilhar a tela.</p></main>
<script>
const $=id=>document.getElementById(id);let ws=null,stream=null,pc=null,role=null,room=null,pendingCandidates=[],remoteDescriptionReady=false;let videoScale=1;
const say=t=>$("status").textContent=t;
function send(m){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(m))}
function setVideo(s){$("video").srcObject=s;$("placeholder").style.display="none";$("video").volume=Number($("volume").value)}
function createPeer(){if(pc)pc.close();pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]});pc.onicecandidate=e=>e.candidate&&send({type:"candidate",candidate:e.candidate});pc.onconnectionstatechange=()=>{if(pc.connectionState==="connected")say(role==="host"?"Sala conectada. Transmissão ativa.":"Conectado! Recebendo transmissão...");if(["failed","disconnected"].includes(pc.connectionState))say("Conexão de vídeo interrompida.")};pc.oniceconnectionstatechange=()=>{if(pc.iceConnectionState==="failed")say("Não foi possível estabelecer a conexão de vídeo.")};if(role==="viewer")pc.ontrack=e=>e.streams[0]&&setVideo(e.streams[0]);if(role==="host"&&stream)stream.getTracks().forEach(t=>pc.addTrack(t,stream));return pc}
async function flush(){if(!pc||!remoteDescriptionReady)return;for(const c of pendingCandidates.splice(0))try{await pc.addIceCandidate(c)}catch(e){console.warn(e)}}
function connect(r,w){return new Promise((resolve,reject)=>{room=r.toUpperCase();role=w;const proto=location.protocol==="https:"?"wss:":"ws:";ws=new WebSocket(proto+"//"+location.host);ws.onopen=()=>send({type:"join",room});ws.onerror=()=>reject(Error("Falha ao conectar ao servidor."));ws.onmessage=async ev=>{let m;try{m=JSON.parse(ev.data)}catch{return}try{
if(m.type==="error")return say(m.message);
if(m.type==="joined"){resolve();if(role==="viewer")say(m.hasPeer?"Sala encontrada. Aguardando transmissão...":"Sala encontrada. Aguardando o anfitrião.");return}
if(m.type==="peer-joined"&&role==="host"){
  if(!pc||pc.signalingState==="stable")await makeOffer();
  return;
}
if(m.type==="offer"&&role==="viewer"){
  if(pc)pc.close();
  remoteDescriptionReady=false;
  pendingCandidates=[];
  createPeer();
  await pc.setRemoteDescription(m.description);
  remoteDescriptionReady=true;
  await flush();
  const a=await pc.createAnswer();
  await pc.setLocalDescription(a);
  send({type:"answer",description:pc.localDescription});
  return;
}
if(m.type==="answer"&&role==="host"&&pc){
  if(pc.signalingState!=="have-local-offer")return;
  await pc.setRemoteDescription(m.description);
  remoteDescriptionReady=true;
  await flush();
  return;
}
if(m.type==="candidate"&&m.candidate){if(!pc||!remoteDescriptionReady)pendingCandidates.push(m.candidate);else await pc.addIceCandidate(m.candidate);return}
if(m.type==="peer-left"){if(pc){pc.close();pc=null}remoteDescriptionReady=false;pendingCandidates=[];say(role==="host"?"Aguardando alguém entrar...":"A outra pessoa saiu.")}
}catch(e){console.error(e);say("Erro de vídeo: "+e.message)}}})}
let makingOffer=false;
async function makeOffer(){
  if(!stream||!ws||ws.readyState!==WebSocket.OPEN)return;
  if(makingOffer)return;
  if(pc&&pc.signalingState!=="stable")return;
  makingOffer=true;
  try{
    remoteDescriptionReady=false;
    pendingCandidates=[];
    createPeer();
    const o=await pc.createOffer();
    if(pc.signalingState!=="stable")return;
    await pc.setLocalDescription(o);
    send({type:"offer",description:pc.localDescription});
  }catch(e){
    console.error(e);
    say("Erro ao iniciar a transmissão: "+e.message);
  }finally{
    makingOffer=false;
  }
}
$("create").onclick=async()=>{try{if(!navigator.mediaDevices?.getDisplayMedia)throw Error("Seu navegador não permite compartilhamento de tela neste endereço.");const c=($("room").value.trim()||"NEXUX"+Math.random().toString(36).slice(2,7)).toUpperCase();if(!/^[A-Z0-9-]{3,20}$/.test(c))throw Error("Use somente letras, números e hífen no código.");$("room").value=c;say("Pedindo permissão para compartilhar a tela...");stream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:{ideal:30,max:60}},audio:true});setVideo(stream);$("stop").disabled=false;await connect(c,"host");stream.getVideoTracks()[0].onended=stop;say("Sala pronta. Envie o código "+c)}catch(e){console.error(e);say(e.message||"Não foi possível criar a sala.")}};
$("join").onclick=async()=>{const c=$("room").value.trim().toUpperCase();if(!c)return say("Digite o código da sala.");if(!/^[A-Z0-9-]{3,20}$/.test(c))return say("Código inválido.");try{say("Conectando à sala...");await connect(c,"viewer")}catch(e){say(e.message)}};
function stop(){stream?.getTracks().forEach(t=>t.stop());pc?.close();ws?.close();stream=null;pc=null;ws=null;remoteDescriptionReady=false;pendingCandidates=[];makingOffer=false;$("video").srcObject=null;$("placeholder").style.display="";$("stop").disabled=true;say("Compartilhamento encerrado.")}$("stop").onclick=stop;
$("copy").onclick=async()=>{const c=$("room").value.trim();if(!c)return say("Digite ou crie um código.");try{await navigator.clipboard.writeText(c);say("Código copiado.")}catch{say("Código: "+c)}};

$("volume").oninput=()=>{const v=Number($("volume").value);$("video").volume=v;$("video").muted=v===0;$("mute").textContent=v===0?"🔇":"🔊"};
$("mute").onclick=()=>{const v=$("video");v.muted=!v.muted;$("mute").textContent=v.muted?"🔇":"🔊";if(!v.muted&&Number($("volume").value)===0){$("volume").value=.8;v.volume=.8}};
function applyZoom(){const box=$("videoBox");box.classList.toggle("small",videoScale<1);box.classList.toggle("large",videoScale>1);$("video").style.transform=`scale(${videoScale})`;$("video").style.transformOrigin="center"}
$("zoomOut").onclick=()=>{videoScale=Math.max(.65,+(videoScale-.1).toFixed(2));applyZoom()};
$("zoomIn").onclick=()=>{videoScale=Math.min(1.5,+(videoScale+.1).toFixed(2));applyZoom()};
$("fullscreen").onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $("videoBox").requestFullscreen()}catch(e){say("Tela cheia não disponível neste navegador.")}};
</script></body></html>
